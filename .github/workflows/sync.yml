name: Finance sync

on:
  workflow_dispatch:
    inputs:
      source:
        description: Provider to sync (Plaid also syncs linked Robinhood)
        required: true
        default: all
        type: choice
        options:
          - all
          - plaid
          - robinhood
      dry_run:
        description: Fetch and validate without database writes
        required: true
        default: false
        type: boolean
  schedule:
    # An off-peak minute reduces GitHub scheduler delays.
    - cron: "17 */3 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: finance-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: INFO
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'America/New_York' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PLAID_ENV: ${{ vars.PLAID_ENV || 'sandbox' }}
      PLAID_COUNTRY_CODES: ${{ vars.PLAID_COUNTRY_CODES || 'US' }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_ACCESS_TOKENS: ${{ secrets.PLAID_ACCESS_TOKENS }}
      # Accepted during migration from versions that stored one Plaid Item.
      PLAID_ACCESS_TOKEN: ${{ secrets.PLAID_ACCESS_TOKEN }}
      ROBINHOOD_SESSION_B64: ${{ secrets.ROBINHOOD_SESSION_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pinned sync dependencies
        run: python -m pip install --disable-pip-version-check --requirement scripts/requirements.txt

      - name: Sync financial data
        env:
          SYNC_SOURCE: ${{ inputs.source || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--source "$SYNC_SOURCE")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/sync.py "${args[@]}"
