name: Finance sync

on:
  workflow_dispatch:
    inputs:
      source:
        description: Provider to sync
        required: true
        default: all
        type: choice
        options:
          - all
          - plaid
          - robinhood
      dry_run:
        description: Fetch and validate without database writes
        required: true
        default: false
        type: boolean
  schedule:
    # An off-peak minute reduces GitHub scheduler delays.
    - cron: "17 */3 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: finance-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: INFO
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'America/New_York' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PLAID_ENV: ${{ vars.PLAID_ENV || 'sandbox' }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_ACCESS_TOKEN: ${{ secrets.PLAID_ACCESS_TOKEN }}
      ROBINHOOD_SESSION_B64: ${{ secrets.ROBINHOOD_SESSION_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pinned sync dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Sync financial data
        env:
          SYNC_SOURCE: ${{ inputs.source || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--source "$SYNC_SOURCE")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/sync.py "${args[@]}"
